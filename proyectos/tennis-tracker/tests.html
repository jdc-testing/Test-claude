<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tests — Tennis Logic</title>
<style>
  body{font-family:monospace;padding:20px;background:#f0f4f0;color:#1b2d1e;max-width:640px;margin:0 auto}
  h1{font-size:1.2rem;margin-bottom:4px}
  p.sub{font-size:.8rem;color:#6b7c6d;margin-bottom:20px}
  .suite{margin-bottom:20px}
  .suite h2{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#6b7c6d;margin-bottom:8px;border-bottom:1px solid #c8dfc9;padding-bottom:4px}
  .test{display:flex;align-items:baseline;gap:8px;padding:4px 0;font-size:.88rem}
  .ok{color:#43a047;font-weight:700}
  .fail{color:#e53935;font-weight:700}
  .desc{flex:1}
  .got{font-size:.76rem;color:#888}
  #summary{margin-top:20px;padding:14px;border-radius:10px;font-weight:700;font-size:1rem}
  #summary.all-ok{background:#e8f5e9;color:#2e7d32}
  #summary.has-fail{background:#ffebee;color:#c62828}
</style>
</head>
<body>
<h1>🎾 Tests — Tennis Logic</h1>
<p class="sub">Suite de tests para las funciones puras de lógica de tenis.</p>
<div id="results"></div>
<div id="summary"></div>

<script>
'use strict';

// ══════════════════════════════════════════════════════
//  COPIA DE LAS FUNCIONES PURAS (de tennis-logic.js)
//  para no depender de otros scripts en los tests.
// ══════════════════════════════════════════════════════

function getPointDisplay(p1, p2, noDeuce) {
  const L = ['0', '15', '30', '40'];
  if (p1 < 3 && p2 < 3) return { p1: L[p1], p2: L[p2] };
  if (noDeuce) return { p1: p1 >= 3 ? '40' : L[p1], p2: p2 >= 3 ? '40' : L[p2] };
  if (p1 === p2)     return { p1: 'Deuce', p2: 'Deuce' };
  if (p1 - p2 === 1) return { p1: 'Ad',   p2: '—' };
  if (p2 - p1 === 1) return { p1: '—',    p2: 'Ad' };
  return { p1: String(p1), p2: String(p2) };
}

function gameWinner(p1, p2, noDeuce) {
  if (noDeuce) {
    if (p1 >= 4 && p1 > p2) return 'p1';
    if (p2 >= 4 && p2 > p1) return 'p2';
  } else {
    if (p1 >= 4 && p1 - p2 >= 2) return 'p1';
    if (p2 >= 4 && p2 - p1 >= 2) return 'p2';
  }
  return null;
}

function setWinner(p1, p2) {
  if (p1 >= 6 && p1 - p2 >= 2) return 'p1';
  if (p2 >= 6 && p2 - p1 >= 2) return 'p2';
  return null;
}

function tiebreakWinner(p1, p2, target) {
  if (p1 >= target && p1 - p2 >= 2) return 'p1';
  if (p2 >= target && p2 - p1 >= 2) return 'p2';
  return null;
}

// ══════════════════════════════════════════════════════
//  FRAMEWORK DE TEST MINIMALISTA
// ══════════════════════════════════════════════════════

const suites = [];
let _suite = null;

function describe(name, fn) {
  _suite = { name, tests: [] };
  suites.push(_suite);
  fn();
}

function it(desc, fn) {
  let ok = false, errMsg = '';
  try { fn(); ok = true; }
  catch (e) { errMsg = e.message; }
  _suite.tests.push({ desc, ok, errMsg });
}

function expect(val) {
  return {
    toBe(expected) {
      if (val !== expected) throw new Error(`esperaba ${JSON.stringify(expected)}, recibió ${JSON.stringify(val)}`);
    },
    toEqual(expected) {
      const a = JSON.stringify(val), b = JSON.stringify(expected);
      if (a !== b) throw new Error(`esperaba ${b}, recibió ${a}`);
    },
    toBeNull() {
      if (val !== null) throw new Error(`esperaba null, recibió ${JSON.stringify(val)}`);
    },
  };
}

// ══════════════════════════════════════════════════════
//  TESTS
// ══════════════════════════════════════════════════════

// ── getPointDisplay ──────────────────────────────────
describe('getPointDisplay — con deuce', () => {
  it('0-0 → "0" | "0"', () => {
    const r = getPointDisplay(0, 0, false);
    expect(r).toEqual({ p1: '0', p2: '0' });
  });
  it('1-2 → "15" | "30"', () => {
    expect(getPointDisplay(1, 2, false)).toEqual({ p1: '15', p2: '30' });
  });
  it('3-3 → Deuce', () => {
    expect(getPointDisplay(3, 3, false)).toEqual({ p1: 'Deuce', p2: 'Deuce' });
  });
  it('4-3 → Ad para p1', () => {
    expect(getPointDisplay(4, 3, false)).toEqual({ p1: 'Ad', p2: '—' });
  });
  it('3-4 → Ad para p2', () => {
    expect(getPointDisplay(3, 4, false)).toEqual({ p1: '—', p2: 'Ad' });
  });
  it('5-5 → Deuce (vuelven a empatar)', () => {
    expect(getPointDisplay(5, 5, false)).toEqual({ p1: 'Deuce', p2: 'Deuce' });
  });
});

describe('getPointDisplay — sin deuce', () => {
  it('3-3 → "40" | "40"', () => {
    expect(getPointDisplay(3, 3, true)).toEqual({ p1: '40', p2: '40' });
  });
  it('2-1 → "30" | "15"', () => {
    expect(getPointDisplay(2, 1, true)).toEqual({ p1: '30', p2: '15' });
  });
});

// ── gameWinner ───────────────────────────────────────
describe('gameWinner — con deuce', () => {
  it('3-0 → null (no se gana aún)', () => {
    expect(gameWinner(3, 0, false)).toBeNull();
  });
  it('4-0 → p1', () => {
    expect(gameWinner(4, 0, false)).toBe('p1');
  });
  it('4-2 → p1', () => {
    expect(gameWinner(4, 2, false)).toBe('p1');
  });
  it('4-3 → null (deuce+1)', () => {
    expect(gameWinner(4, 3, false)).toBeNull();
  });
  it('5-3 → p1 (diferencia ≥2)', () => {
    expect(gameWinner(5, 3, false)).toBe('p1');
  });
  it('3-4 → null', () => {
    expect(gameWinner(3, 4, false)).toBeNull();
  });
  it('0-4 → p2', () => {
    expect(gameWinner(0, 4, false)).toBe('p2');
  });
});

describe('gameWinner — sin deuce', () => {
  it('4-3 → p1 (sin deuce, siguiente a 40-40 gana)', () => {
    expect(gameWinner(4, 3, true)).toBe('p1');
  });
  it('3-4 → p2', () => {
    expect(gameWinner(3, 4, true)).toBe('p2');
  });
  it('3-3 → null (empatados en 40)', () => {
    expect(gameWinner(3, 3, true)).toBeNull();
  });
});

// ── setWinner ────────────────────────────────────────
describe('setWinner', () => {
  it('6-0 → p1', () => expect(setWinner(6, 0)).toBe('p1'));
  it('6-4 → p1', () => expect(setWinner(6, 4)).toBe('p1'));
  it('7-5 → p1', () => expect(setWinner(7, 5)).toBe('p1'));
  it('6-5 → null (no hay 2 de diferencia)', () => expect(setWinner(6, 5)).toBeNull());
  it('6-6 → null (tiebreak pendiente)', () => expect(setWinner(6, 6)).toBeNull());
  it('5-6 → null', () => expect(setWinner(5, 6)).toBeNull());
  it('4-6 → p2', () => expect(setWinner(4, 6)).toBe('p2'));
  it('0-6 → p2', () => expect(setWinner(0, 6)).toBe('p2'));
  it('8-10 → p2 (set largo sin tiebreak)', () => expect(setWinner(8, 10)).toBe('p2'));
});

// ── tiebreakWinner ───────────────────────────────────
describe('tiebreakWinner — estándar (a 7)', () => {
  it('7-0 → p1', ()  => expect(tiebreakWinner(7, 0, 7)).toBe('p1'));
  it('7-5 → p1', ()  => expect(tiebreakWinner(7, 5, 7)).toBe('p1'));
  it('6-6 → null',() => expect(tiebreakWinner(6, 6, 7)).toBeNull());
  it('7-6 → null (solo 1 de diferencia)', () => expect(tiebreakWinner(7, 6, 7)).toBeNull());
  it('8-6 → p1', ()  => expect(tiebreakWinner(8, 6, 7)).toBe('p1'));
  it('5-7 → p2', ()  => expect(tiebreakWinner(5, 7, 7)).toBe('p2'));
  it('10-8 → p1',()  => expect(tiebreakWinner(10, 8, 7)).toBe('p1'));
});

describe('tiebreakWinner — super TB (a 10)', () => {
  it('10-0 → p1', () => expect(tiebreakWinner(10, 0, 10)).toBe('p1'));
  it('10-9 → null', () => expect(tiebreakWinner(10, 9, 10)).toBeNull());
  it('11-9 → p1', () => expect(tiebreakWinner(11, 9, 10)).toBe('p1'));
  it('9-10 → null', () => expect(tiebreakWinner(9, 10, 10)).toBeNull());
  it('9-11 → p2', () => expect(tiebreakWinner(9, 11, 10)).toBe('p2'));
});

// ══════════════════════════════════════════════════════
//  RENDERIZAR RESULTADOS
// ══════════════════════════════════════════════════════

let total = 0, failed = 0;
const container = document.getElementById('results');

for (const suite of suites) {
  const sDiv = document.createElement('div');
  sDiv.className = 'suite';
  sDiv.innerHTML = `<h2>${suite.name}</h2>`;

  for (const t of suite.tests) {
    total++;
    if (!t.ok) failed++;
    const tDiv = document.createElement('div');
    tDiv.className = 'test';
    tDiv.innerHTML = `
      <span class="${t.ok ? 'ok' : 'fail'}">${t.ok ? '✓' : '✗'}</span>
      <span class="desc">${t.desc}</span>
      ${!t.ok ? `<span class="got">${t.errMsg}</span>` : ''}`;
    sDiv.appendChild(tDiv);
  }
  container.appendChild(sDiv);
}

const sumEl = document.getElementById('summary');
sumEl.className = failed === 0 ? 'all-ok' : 'has-fail';
sumEl.textContent = failed === 0
  ? `✓ Todos los tests pasaron (${total}/${total})`
  : `✗ ${failed} test(s) fallaron de ${total}`;
</script>
</body>
</html>
