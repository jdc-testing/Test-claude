<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4caf50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Habits">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    :root {
      --accent: #4caf50;
      --accent-light: #e8f5e9;
      --bg: #f5f5f5;
      --surface: #ffffff;
      --text: #212121;
      --text-muted: #757575;
      --danger: #e53935;
      --border: #e0e0e0;
      --nav-h: 64px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 17px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 20px; font-weight: 700; }
    header p  { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

    /* ── SCREENS ── */
    .screen { display: none; flex: 1; overflow-y: auto; padding-bottom: calc(var(--nav-h) + 16px); }
    .screen.active { display: block; }

    /* ── PROGRESS BAR ── */
    .progress-wrap { padding: 14px 20px 10px; }
    .progress-label {
      display: flex; justify-content: space-between;
      font-size: 13px; color: var(--text-muted); margin-bottom: 6px;
    }
    .progress-bar {
      height: 8px; background: var(--border); border-radius: 99px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: var(--accent);
      border-radius: 99px; transition: width 0.3s ease;
    }

    /* ── HABIT LIST ── */
    .habit-list { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }

    .habit-row {
      background: var(--surface);
      border-radius: 14px;
      display: flex;
      align-items: center;
      padding: 14px 16px;
      gap: 14px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease;
      border: 2px solid transparent;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      min-height: 68px;
    }
    .habit-row:active { transform: scale(0.97); }
    .habit-row.done {
      background: var(--accent-light);
      border-color: var(--accent);
    }

    .check-circle {
      width: 32px; height: 32px; flex-shrink: 0;
      border-radius: 50%;
      border: 2.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease;
      background: var(--surface);
    }
    .habit-row.done .check-circle {
      background: var(--accent);
      border-color: var(--accent);
    }
    .check-icon {
      display: none;
      color: white;
      font-size: 17px;
      font-weight: 700;
    }
    .habit-row.done .check-icon { display: block; }

    .habit-info { flex: 1; min-width: 0; }
    .habit-name {
      font-weight: 600;
      font-size: 16px;
      transition: color 0.15s;
    }
    .habit-row.done .habit-name {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .habit-emoji { font-size: 22px; flex-shrink: 0; }

    .streak-badge {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .streak-badge.active { color: #e65100; }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; }

    /* ── HISTORY ── */
    .history-list { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
    .history-day {
      background: var(--surface);
      border-radius: 14px;
      padding: 14px 16px;
    }
    .history-day-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .history-date { font-weight: 600; font-size: 15px; }
    .history-count { font-size: 13px; color: var(--text-muted); }
    .history-dots { display: flex; gap: 6px; flex-wrap: wrap; }
    .habit-dot {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      background: var(--border);
    }
    .habit-dot.done { background: var(--accent-light); }

    /* ── MANAGE SCREEN ── */
    .manage-header {
      padding: 16px 20px 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .manage-header span { font-size: 14px; color: var(--text-muted); }

    .manage-list { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }

    .manage-row {
      background: var(--surface);
      border-radius: 14px;
      display: flex; align-items: center;
      padding: 14px 16px; gap: 12px;
      min-height: 64px;
    }
    .manage-emoji { font-size: 22px; flex-shrink: 0; }
    .manage-label { flex: 1; font-weight: 600; }
    .delete-btn {
      background: none; border: none; cursor: pointer;
      color: var(--danger); font-size: 20px; padding: 4px 8px;
      border-radius: 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .delete-btn:active { background: #ffebee; }

    /* ── ADD FORM ── */
    .add-form {
      margin: 16px 20px 0;
      background: var(--surface);
      border-radius: 14px;
      padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .add-form h3 { font-size: 15px; font-weight: 700; }
    .form-row { display: flex; gap: 10px; }
    .emoji-input {
      width: 56px; text-align: center; font-size: 22px;
      border: 1.5px solid var(--border); border-radius: 10px;
      padding: 8px; background: var(--bg);
    }
    .text-input {
      flex: 1; font-size: 16px;
      border: 1.5px solid var(--border); border-radius: 10px;
      padding: 10px 12px; background: var(--bg);
      font-family: inherit;
    }
    .text-input:focus, .emoji-input:focus {
      outline: none; border-color: var(--accent);
    }
    .add-btn {
      background: var(--accent); color: white;
      border: none; border-radius: 10px;
      padding: 12px; font-size: 16px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .add-btn:active { opacity: 0.85; }
    .add-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

    .limit-note {
      text-align: center; font-size: 13px;
      color: var(--text-muted); padding: 12px 20px 0;
    }

    /* ── BOTTOM NAV ── */
    nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 20;
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px;
      background: none; border: none; cursor: pointer;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-btn .nav-icon { font-size: 22px; line-height: 1; }
    .nav-btn .nav-label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .nav-btn.active .nav-label { color: var(--accent); }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: calc(var(--nav-h) + 16px);
      left: 50%; transform: translateX(-50%) translateY(20px);
      background: #323232; color: white;
      padding: 10px 20px; border-radius: 20px;
      font-size: 14px; font-weight: 500;
      opacity: 0; transition: all 0.25s ease;
      pointer-events: none; white-space: nowrap;
      z-index: 100;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (min-width: 480px) {
      body { max-width: 480px; margin: 0 auto; }
      nav { max-width: 480px; left: 50%; transform: translateX(-50%); }
    }
  </style>
</head>
<body>

<header>
  <h1 id="screen-title">Hoy</h1>
  <p id="screen-subtitle"></p>
</header>

<!-- TODAY -->
<section id="screen-today" class="screen active">
  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progress-text">0 / 0 completados</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>
  <div class="habit-list" id="today-list"></div>
</section>

<!-- HISTORY -->
<section id="screen-history" class="screen">
  <div class="history-list" id="history-list"></div>
</section>

<!-- MANAGE -->
<section id="screen-manage" class="screen">
  <div class="manage-header">
    <span id="habit-count-label">0 / 8 hábitos</span>
  </div>
  <div class="manage-list" id="manage-list"></div>
  <div class="add-form" id="add-form">
    <h3>Añadir hábito</h3>
    <div class="form-row">
      <input class="emoji-input" id="new-emoji" type="text" maxlength="2" placeholder="🎯">
      <input class="text-input" id="new-label" type="text" maxlength="30" placeholder="Nombre del hábito">
    </div>
    <button class="add-btn" id="add-btn" onclick="addHabit()">Añadir</button>
  </div>
  <p class="limit-note" id="limit-note" style="display:none">Máximo 8 hábitos alcanzado</p>
</section>

<!-- NAV -->
<nav>
  <button class="nav-btn active" id="nav-today" onclick="showScreen('today')">
    <span class="nav-icon">☀️</span>
    <span class="nav-label">Hoy</span>
  </button>
  <button class="nav-btn" id="nav-history" onclick="showScreen('history')">
    <span class="nav-icon">📅</span>
    <span class="nav-label">Historial</span>
  </button>
  <button class="nav-btn" id="nav-manage" onclick="showScreen('manage')">
    <span class="nav-icon">⚙️</span>
    <span class="nav-label">Hábitos</span>
  </button>
</nav>

<div id="toast"></div>

<script>
  // ── STATE ──
  let habits = [];
  let records = {};

  const DEFAULT_HABITS = [
    { id: 'creatine', label: 'Tomar creatina', emoji: '💊' },
    { id: 'exercise', label: 'Hacer deporte',  emoji: '🏋️' },
    { id: 'study',    label: 'Estudiar',        emoji: '📚' },
    { id: 'water',    label: 'Beber agua',      emoji: '💧' },
  ];

  // ── STORAGE ──
  function loadData() {
    try {
      habits  = JSON.parse(localStorage.getItem('ht_habits'))  || DEFAULT_HABITS;
      records = JSON.parse(localStorage.getItem('ht_records')) || {};
    } catch { habits = DEFAULT_HABITS; records = {}; }
  }

  function saveHabits() {
    try { localStorage.setItem('ht_habits', JSON.stringify(habits)); }
    catch { showToast('Error al guardar. Almacenamiento lleno.'); }
  }

  function saveRecords() {
    try { localStorage.setItem('ht_records', JSON.stringify(records)); }
    catch { showToast('Error al guardar. Almacenamiento lleno.'); }
  }

  // ── DOMAIN ──
  function todayKey() {
    return new Date().toISOString().slice(0, 10);
  }

  function formatDate(key) {
    const [y, m, d] = key.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    return date.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  function toggleHabit(habitId) {
    const today = todayKey();
    if (!records[today]) records[today] = {};
    records[today][habitId] = !records[today][habitId];
    saveRecords();
  }

  function getStreak(habitId) {
    let streak = 0;
    const d = new Date();
    for (let i = 0; i < 365; i++) {
      const key = d.toISOString().slice(0, 10);
      if (records[key] && records[key][habitId] === true) {
        streak++;
        d.setDate(d.getDate() - 1);
      } else { break; }
    }
    return streak;
  }

  function getLast30Days() {
    const days = [];
    const d = new Date();
    for (let i = 0; i < 30; i++) {
      days.push(d.toISOString().slice(0, 10));
      d.setDate(d.getDate() - 1);
    }
    return days;
  }

  // ── RENDER: TODAY ──
  function renderToday() {
    const today = todayKey();
    const dayRecord = records[today] || {};
    const list = document.getElementById('today-list');

    const now = new Date();
    const dateStr = now.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
    document.getElementById('screen-subtitle').textContent =
      dateStr.charAt(0).toUpperCase() + dateStr.slice(1);

    if (habits.length === 0) {
      list.innerHTML = `<div class="empty-state">
        <div class="icon">🎯</div>
        <p>No tienes hábitos aún.<br>Ve a <strong>Hábitos</strong> para añadir.</p>
      </div>`;
      updateProgress(0, 0);
      return;
    }

    const done = habits.filter(h => dayRecord[h.id]).length;
    updateProgress(done, habits.length);

    list.innerHTML = habits.map(h => {
      const checked = !!dayRecord[h.id];
      const streak  = getStreak(h.id);
      const streakHtml = streak > 0
        ? `<span class="streak-badge active">🔥 ${streak}d</span>`
        : `<span class="streak-badge">—</span>`;
      return `
        <div class="habit-row ${checked ? 'done' : ''}" onclick="onHabitTap('${h.id}')">
          <div class="check-circle">
            <span class="check-icon">✓</span>
          </div>
          <div class="habit-info">
            <div class="habit-name">${h.label}</div>
          </div>
          <span class="habit-emoji">${h.emoji}</span>
          ${streakHtml}
        </div>`;
    }).join('');
  }

  function updateProgress(done, total) {
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    document.getElementById('progress-text').textContent = `${done} / ${total} completados`;
    document.getElementById('progress-pct').textContent  = `${pct}%`;
    document.getElementById('progress-fill').style.width = `${pct}%`;
  }

  // ── RENDER: HISTORY ──
  function renderHistory() {
    const days  = getLast30Days();
    const list  = document.getElementById('history-list');

    const rows = days.map(key => {
      const dayRecord = records[key] || {};
      const done  = habits.filter(h => dayRecord[h.id]).length;
      const total = habits.length;
      if (total === 0) return '';

      const dots = habits.map(h =>
        `<div class="habit-dot ${dayRecord[h.id] ? 'done' : ''}" title="${h.label}">${h.emoji}</div>`
      ).join('');

      const label = formatDate(key);
      return `
        <div class="history-day">
          <div class="history-day-header">
            <span class="history-date">${label.charAt(0).toUpperCase() + label.slice(1)}</span>
            <span class="history-count">${done}/${total}</span>
          </div>
          <div class="history-dots">${dots}</div>
        </div>`;
    }).filter(Boolean);

    list.innerHTML = rows.length
      ? rows.join('')
      : `<div class="empty-state"><div class="icon">📭</div><p>Sin historial aún.</p></div>`;
  }

  // ── RENDER: MANAGE ──
  function renderManage() {
    const count = habits.length;
    document.getElementById('habit-count-label').textContent = `${count} / 8 hábitos`;

    const list = document.getElementById('manage-list');
    if (count === 0) {
      list.innerHTML = `<div class="empty-state"><div class="icon">🌱</div><p>Aún no tienes hábitos.</p></div>`;
    } else {
      list.innerHTML = habits.map(h => `
        <div class="manage-row">
          <span class="manage-emoji">${h.emoji}</span>
          <span class="manage-label">${h.label}</span>
          <button class="delete-btn" onclick="deleteHabit('${h.id}')" title="Eliminar">✕</button>
        </div>`
      ).join('');
    }

    const atLimit = count >= 8;
    document.getElementById('add-form').style.display  = atLimit ? 'none' : 'flex';
    document.getElementById('limit-note').style.display = atLimit ? 'block' : 'none';
  }

  // ── ACTIONS ──
  function onHabitTap(habitId) {
    toggleHabit(habitId);
    renderToday();
  }

  function addHabit() {
    if (habits.length >= 8) return;
    const emoji = document.getElementById('new-emoji').value.trim() || '🎯';
    const label = document.getElementById('new-label').value.trim();
    if (!label) { showToast('Escribe un nombre para el hábito'); return; }

    const id = 'habit_' + Date.now();
    habits.push({ id, label, emoji });
    saveHabits();
    document.getElementById('new-emoji').value = '';
    document.getElementById('new-label').value = '';
    renderManage();
    showToast(`"${label}" añadido`);
  }

  function deleteHabit(habitId) {
    const habit = habits.find(h => h.id === habitId);
    habits = habits.filter(h => h.id !== habitId);
    saveHabits();
    renderManage();
    if (habit) showToast(`"${habit.label}" eliminado`);
  }

  // ── NAVIGATION ──
  let currentScreen = 'today';
  const titles = { today: 'Hoy', history: 'Historial', manage: 'Hábitos' };

  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`screen-${name}`).classList.add('active');
    document.getElementById(`nav-${name}`).classList.add('active');
    document.getElementById('screen-title').textContent = titles[name];

    if (name !== 'today') document.getElementById('screen-subtitle').textContent = '';

    currentScreen = name;
    if (name === 'today')   renderToday();
    if (name === 'history') renderHistory();
    if (name === 'manage')  renderManage();
  }

  // ── TOAST ──
  let toastTimer;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  // ── ENTER key on form ──
  document.getElementById('new-label').addEventListener('keydown', e => {
    if (e.key === 'Enter') addHabit();
  });

  // ── INIT ──
  loadData();
  renderToday();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
</script>
</body>
</html>
