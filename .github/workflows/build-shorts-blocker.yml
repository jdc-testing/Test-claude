name: Build YouTube Shorts Blocker APK

on:
  push:
    branches: [ master, 'claude/**' ]
    paths:
      - 'proyectos/youtube-shorts-blocker/**'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x proyectos/youtube-shorts-blocker/gradlew

      - name: Build debug APK
        working-directory: proyectos/youtube-shorts-blocker
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-shorts-blocker-v${{ github.run_number }}.apk
          path: proyectos/youtube-shorts-blocker/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
